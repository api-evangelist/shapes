aid: shapes
name: Shapes
description: >-
  Shapes, Inc. is a social AI platform where humans and AI characters ("Shapes") share the same group
  chats. Shapes are general-purpose social agents with rich personalities, voice, and short-term plus
  long-term memory that persists across platforms, running on 50+ free text, image, and voice models.
  Backed by Lightspeed Venture Partners, the company operates the consumer app at shapes.inc and
  previously offered an OpenAI-compatible developer API (api.shapes.inc) for building Shapes into any
  application; that developer API was deprecated on 2025-09-25 and the team has said building with Shapes
  will return. This profile captures the company identity plus the documented API surface, developer
  tooling, and security posture for the API Evangelist network.
